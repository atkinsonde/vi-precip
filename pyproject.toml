[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-precip"
version = "0.1.0"
description = "Vancouver Island / South Coast autumn precipitation, dry spells and ENSO"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.1",
  "pyarrow>=14",
  "requests>=2.31",
  "pyyaml>=6",
  "matplotlib>=3.7",
  "pyshp>=2.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vi-precip = "vi_precip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
