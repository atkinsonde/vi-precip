# Vancouver Island / South Coast autumn dryness analysis — configuration.
# Paths are relative to the project root. See DESIGN.md for the reasoning behind each setting.

analysis:
  target_year: 2026
  end_date: "2026-10-26"        # last day of the target period; its month-day is used for every year
  baseline: [2000, 2025]        # inclusive; target year is always excluded from fitted/reference stats
  window_start: "09-01"         # primary window: Sep 1 .. end month-day
  extended_start: "08-01"       # continuous series for spells/events/onset
  download_start: "2000-01-01"  # earliest date fetched for the inventory stage
  long_record_start: 1950       # used in milestone 4
  # Driest N-day period: lowest running N-day total between this month-day and the end date.
  # Starts Sep 1 because August is climatologically the driest month: with an Aug 1 start the
  # driest window of almost every year would sit in August and say nothing about the autumn.
  driest_n_days: [30, 45]
  driest_search_start: "09-01"
  driest_max_missing: 2

brief:
  # Stations for the cumulative-precipitation panels (unit IDs; composites start with C_).
  # Missing IDs are skipped; if none are found, one Tier 1 station per region is chosen.
  stations: [C_1018620, C_1108447, 10253G0, 1021830, 1034600, C_1026270, 10476F0, 1046391]

thresholds:
  wet_mm: [1.0, 0.2]            # first value is primary; all values are computed

completeness:
  totals_max_missing_days: 2    # a period total is valid with at most this many missing days
  daily_max_missing_days: 5     # daily-distribution metrics valid with at most this many missing days (window)
  tier1_min_baseline_years: 22
  tier2_min_baseline_years: 12
  provisional_max_missing_days: 10  # baseline qualifies but target window has 3-10 missing days (late reports)

qc:
  # ECCC flag -> status. Statuses: missing, trace, accumulated, estimated, uncertain, incomplete.
  # Anything not listed becomes "unknown" (kept as valid, counted, and reported).
  flag_status:
    M: missing
    T: trace
    A: accumulated
    F: accumulated              # accumulated and estimated
    E: estimated
    C: uncertain                # precipitation occurred, amount uncertain
    L: uncertain                # precipitation may or may not have occurred
    "^": incomplete             # value based on incomplete data
  # status -> treatment: valid | invalid. ("accumulated" is always handled as a block; "trace" -> 0 mm valid.)
  status_treatment:
    estimated: valid
    uncertain: valid
    incomplete: valid           # no '^' flags found in the 2000-2026 inventory
    unknown: valid
  # Volunteer stations report weekend days as C ("precipitation occurred, amount uncertain")
  # followed by an A (accumulated) day. With this on, C days immediately preceding an A/F day
  # join that accumulation block (daily-invalid; counted only in totals and events).
  absorb_uncertain_into_accumulation: true
  max_accumulation_days: 10

composites:
  join_max_km: 1.0
  join_max_dz_m: 20
  review_max_km: 5.0
  review_max_dz_m: 50
  max_overlap_years: 3          # longer concurrent overlap => "parallel"
  max_gap_years: 2
  min_overlap_days_for_stats: 30
  min_overlap_corr: 0.8          # an automatic 'join' is demoted to 'review' below this daily correlation...
  max_overlap_ratio_dev: 0.1     # ...or if the overlap total ratio differs from 1 by more than this
  switch_rule: newer            # newer member takes over from its first valid day

domain:
  # Bounding box for the API station query (lon_min, lat_min, lon_max, lat_max);
  # stations are then assigned to region polygons in domain.py; outside all polygons => dropped.
  bbox: [-128.8, 48.2, -121.3, 51.05]
  province: BC

eccc:
  base_url: "https://api.weather.gc.ca"
  page_limit: 10000
  request_pause_s: 0.25         # politeness delay between requests
  timeout_s: 120
  max_retries: 5
  final_after_days: 60          # a cached year is final if fetched this long after the year ended
  station_cache_days: 30        # re-download station metadata after this many days

basemap:
  # Natural Earth 10 m; downloaded once into data/geo/. Set enabled: false to skip.
  enabled: true
  land_url: "https://naciscdn.org/naturalearth/10m/physical/ne_10m_land.zip"
  coast_url: "https://naciscdn.org/naturalearth/10m/physical/ne_10m_coastline.zip"

paths:
  data: data
  outputs: outputs
  region_overrides: config/region_overrides.csv
  composites_accepted: config/composites.csv
